# Define o nome que aparecera na aba Actions do GitHub.
name: CI Frontend Angular Docker

# Define quando a pipeline sera executada.
on:
  # Executa a pipeline quando houver push nas branches configuradas.
  push:
    # Lista as branches que disparam a pipeline em eventos de push.
    branches:
      # Executa quando o push for feito na branch main.
      - main
      # Executa quando o push for feito na branch master.
      - master
  # Executa a pipeline quando houver pull request para as branches configuradas.
  pull_request:
    # Lista as branches de destino que disparam a pipeline em pull requests.
    branches:
      # Executa quando o pull request apontar para main.
      - main
      # Executa quando o pull request apontar para master.
      - master
  # Permite executar a pipeline manualmente pela tela Actions do GitHub.
  workflow_dispatch:

# Define variaveis reutilizadas pelo job do frontend.
env:
  # Define a versao do Node.js compativel com Angular 22.
  NODE_VERSION: 24.13.1
  # Define o caminho do Dockerfile considerando que ele esta na raiz do repositorio do frontend.
  FRONTEND_DOCKERFILE: Dockerfile
  # Define a pasta usada como contexto do docker build considerando que o repositorio e somente do frontend.
  FRONTEND_CONTEXT: .
  # Define o nome da imagem Docker criada durante a pipeline.
  FRONTEND_IMAGE: frontend-teste-docker2:ci

# Agrupa os jobs que serao executados pela pipeline.
jobs:
  # Job responsavel por instalar, compilar e criar a imagem Docker do frontend Angular.
  build-frontend:
    # Nome amigavel exibido no GitHub Actions para o job do frontend.
    name: Build Angular frontend
    # Define que o job sera executado em uma maquina Linux hospedada pelo GitHub.
    runs-on: ubuntu-latest

    # Lista as etapas executadas pelo job do frontend.
    steps:
      # Baixa o codigo do repositorio para dentro da maquina do GitHub Actions.
      - name: Checkout repository
        # Usa a action oficial do GitHub para fazer checkout do codigo.
        uses: actions/checkout@v4

      # Instala/configura o Node.js necessario para o Angular 22.
      - name: Setup Node
        # Usa a action oficial do GitHub para instalar Node.js.
        uses: actions/setup-node@v4
        # Configura os parametros da action de setup do Node.js.
        with:
          # Usa a versao do Node.js definida na variavel NODE_VERSION.
          node-version: ${{ env.NODE_VERSION }}
          # Habilita cache de dependencias npm para acelerar proximas execucoes.
          cache: npm
          # Usa o package-lock.json da raiz do repositorio como chave do cache npm.
          cache-dependency-path: package-lock.json

      # Instala as dependencias do frontend exatamente como definido no package-lock.json.
      - name: Install frontend dependencies
        # Usa npm ci para instalacao limpa e reprodutivel em ambiente de CI.
        run: npm ci

      # Compila o frontend Angular.
      - name: Build frontend
        # Executa o script de build definido no package.json do frontend.
        run: npm run build

      # Cria a imagem Docker do frontend para validar que o Dockerfile funciona.
      - name: Build frontend Docker image
        # Executa docker build usando o Dockerfile e o contexto da raiz do repositorio do frontend.
        run: docker build --tag "${{ env.FRONTEND_IMAGE }}" --file "${{ env.FRONTEND_DOCKERFILE }}" "${{ env.FRONTEND_CONTEXT }}"
